name: UI Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui_test:
    name: Run Android UI test
    runs-on: ubuntu-22.04

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up JDK environment
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Run tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: ./gradlew :app:connectedFullDebugAndroidTest

      - name: Pull test video recordings
        run: |
          mkdir -p test_recordings
          adb -e pull /sdcard/test_recordings test_recordings || true

      - name: Archive test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-recordings
          path: test_recordings
          if-no-files-found: warn
