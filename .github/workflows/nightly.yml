name: Nightly Build

on:
  push:
    branches:
      - default
    paths-ignore:
      - '**.md'
      - 'screenshots/**'

permissions:
  contents: write

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  build:
    name: Build nightly APK
    runs-on: ubuntu-22.04

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK environment
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup APK signing
        run: |
          echo -n "${{ secrets.SIGNING_KEY }}" | base64 -d > app/storeFile.jks
          {
            echo "storeFile=storeFile.jks"
            echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > custom.properties

      - name: Remove local Java home from gradle.properties
        run: sed -i '/org\.gradle\.java\.home/d' gradle.properties

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PlocalPropertiesFilePath=custom.properties

      - name: Set app version
        run: |
          echo "APP_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -n 1)" >> "$GITHUB_ENV"

      - name: Set short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Collect APKs
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -exec cp {} release-artifacts/ \;
          ls -lah release-artifacts

      - name: Build changelog and move nightly tag
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin --tags --force

          PREV_NIGHTLY_SHA=$(git ls-remote --tags origin nightly | awk '{print $1}')

          {
            echo "⚠️ Automated nightly build from the latest commit on branch \`$REF_NAME\`."
            echo "Commit: $COMMIT_SHA"
            echo "This is a pre-release build and may contain bugs."
            echo ""

            if [ -n "$PREV_NIGHTLY_SHA" ]; then
              echo "## Changes since previous nightly"
              git log --pretty=format:'- %s (%h)' "$PREV_NIGHTLY_SHA".."$COMMIT_SHA"
            else
              echo "## Recent changes"
              git log -20 --pretty=format:'- %s (%h)' "$COMMIT_SHA"
            fi

            echo ""
          } > release-body.md

          cat release-body.md

          git tag -f nightly "$COMMIT_SHA"
          git push origin nightly --force

      - name: Delete old nightly assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly --json assets --jq '.assets[].name' 2>/dev/null | \
            xargs -r -I{} gh release delete-asset nightly "{}" --yes || true

      - name: Create/update nightly release
        uses: softprops/action-gh-release@v1
        with:
          name: WebnovelReader nightly v${{ env.APP_VERSION }} (${{ env.SHORT_SHA }})
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: false
          body_path: release-body.md
          files: release-artifacts/*.apk
